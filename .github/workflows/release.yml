# Build the downloadable artifacts and attach them to a GitHub Release.
#
# Push a tag to cut a release:   git tag v1.0.1 && git push origin v1.0.1
# Or run it by hand from the Actions tab to check the builds without releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel need separate builds: PyInstaller freezes
          # the interpreter and every .so it pulls in, so the bundle is only
          # ever for the architecture it was built on.
          # Pin versioned labels rather than macos-latest, so a release is
          # never quietly built on a new OS; bump both together when one of
          # them is deprecated (macos-13 was retired from under this file).
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Work out the version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            sed -n 's/^__version__ = "\(.*\)"/version=\1/p' src/keyflip/app.py \
              >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pip install -e . pyinstaller
      - run: ./packaging/build_macos.sh
        env:
          PYTHON: python
      - run: ./packaging/build_dmg.sh "${{ steps.v.outputs.version }}" "${{ matrix.arch }}"
      - name: Check the app actually runs
        run: |
          dist/keyflip.app/Contents/MacOS/keyflip --version
          dist/keyflip.app/Contents/MacOS/keyflip hotkey
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
      # After the upload on purpose, as on Windows: a failure here still leaves
      # the disk image downloadable for inspection, but nothing is released.
      - name: Check install.sh installs and updates from the disk image
        timeout-minutes: 5
        run: |
          dmg="$(ls dist/*.dmg)"
          app=/Applications/keyflip.app
          # Stamp it the way a browser would, so the check below means
          # something: whatever the image carried, the app must come out clean.
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$dmg"
          KEYFLIP_DMG="$dmg" ./install.sh
          codesign --verify --deep --strict --verbose=2 "$app"
          if xattr -r "$app" | grep -q com.apple.quarantine; then
            echo "install.sh left $app quarantined - Gatekeeper would block it" >&2
            exit 1
          fi
          "$app/Contents/MacOS/keyflip" --version
          # Again, over the copy the first run left running: the update path.
          KEYFLIP_DMG="$dmg" ./install.sh
          "$app/Contents/MacOS/keyflip" --version
          pkill -x keyflip || true

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Work out the version
        id: v
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            sed -n 's/^__version__ = "\(.*\)"/version=\1/p' src/keyflip/app.py \
              >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pip install -e . pyinstaller
      - run: .\packaging\build_windows.ps1
        env:
          PYTHON: python
      - name: Check the exe actually runs
        shell: pwsh
        run: |
          # A windowed exe does not block the shell, so wait on it explicitly -
          # otherwise this step passes without ever learning whether it started.
          foreach ($a in @('--version', 'hotkey')) {
            $p = Start-Process .\dist\keyflip.exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "keyflip.exe $a exited with $($p.ExitCode)" }
          }
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
      - name: Build the installer
        run: iscc /DMyAppVersion=${{ steps.v.outputs.version }} packaging\keyflip.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*setup.exe
          if-no-files-found: error
      # After the upload on purpose: a failure here still leaves the installer
      # downloadable for inspection, but fails the job so nothing is released.
      - name: Check the installer installs and uninstalls cleanly
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = (Get-ChildItem dist\*setup.exe | Select-Object -First 1).FullName
          # Not -Wait: that also waits for every descendant, and the installer's
          # whole job is to leave keyflip running - so it would never return.
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          $null = $p.Handle   # without touching this first, ExitCode reads back empty
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }

          $dir = "$env:LOCALAPPDATA\Programs\keyflip"
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (-not (Test-Path "$dir\keyflip.exe")) { throw "keyflip.exe was not installed to $dir" }
          $login = (Get-ItemProperty $run -Name keyflip -ErrorAction SilentlyContinue).keyflip
          if (-not $login) { throw 'a fresh install should switch on start at login' }
          Write-Host "installed to $dir"
          Write-Host "login item:  $login"

          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself in %TEMP% and returns
          # early, so wait for the effect rather than for the process.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\keyflip.exe"); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$dir\keyflip.exe") { throw 'uninstall left keyflip.exe behind' }
          if (Get-ItemProperty $run -Name keyflip -ErrorAction SilentlyContinue) {
            throw 'uninstall left the login item behind'
          }
          Write-Host 'uninstalled cleanly'

  release:
    needs: [macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — the quickest way is one line in Terminal. It downloads
            the right build for your Mac, puts keyflip in Applications and
            opens it, with no security warning to get past. Run it again to
            update:

            ```
            curl -fsSL https://raw.githubusercontent.com/Punnawit9285/keyflip/main/install.sh | bash
            ```

            Or download the `.dmg` for your Mac below (`arm64` for Apple
            silicon, `x86_64` for Intel), open it, and drag keyflip to
            Applications. The first time you open it, macOS refuses with
            *"keyflip" Not Opened*, because this build is not notarized with
            an Apple Developer ID. Click **Done**, then open **System Settings
            → Privacy & Security**, scroll down to **Security**, click
            **Open Anyway** next to keyflip and confirm with your password.
            Right-click → Open no longer gets past it on macOS 15 and later.
            Every new version needs this once more; the Terminal line does not.

            Either way, keyflip then asks for Accessibility permission and
            starts by itself the moment you grant it.

            **Windows** — download the `-setup.exe`, open it, and click
            **Install**. That is the whole installation: no administrator
            rights, no questions, and keyflip starts straight away and at every
            sign-in (untick **Start at login** in the tray menu to stop that).
            SmartScreen may warn that the publisher is unknown, because the
            installer is not code-signed: **More info → Run anyway**.

            Then select text that came out in the wrong layout and **tap the
            right Shift twice**.
